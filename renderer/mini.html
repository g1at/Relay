<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Relay 快捷对话</title>
  <link rel="stylesheet" href="fonts/misans.css" />
  <link rel="stylesheet" href="read-only-markdown.css" />
  <link rel="stylesheet" href="local-markdown-images.css" />
  <link rel="stylesheet" href="code-blocks.css" />
  <link rel="stylesheet" href="interaction-surface.css" />
  <link rel="stylesheet" href="permission-controls.css" />
  <link rel="stylesheet" href="mini-chat.css" />
  <link rel="stylesheet" href="brand.css" />
  <link rel="stylesheet" href="scrollbars.css" />
</head>
<body>
  <main class="mini-card" id="miniCard" aria-label="快捷对话">
    <header class="mini-head" title="拖动快捷对话窗口">
      <img id="miniLogo" class="mini-logo relay-default-logo" src="logo.svg" alt="" />
      <span id="miniBrand" class="mini-brand">Relay</span>
      <span class="mini-head-spacer"></span>
      <button id="miniNew" class="mini-icon-button" type="button" title="新对话" aria-label="新对话"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M7.5 18 4 21V6.5A2.5 2.5 0 0 1 6.5 4h11A2.5 2.5 0 0 1 20 6.5v9a2.5 2.5 0 0 1-2.5 2.5z"/><line x1="12" y1="8.5" x2="12" y2="13.5"/><line x1="9.5" y1="11" x2="14.5" y2="11"/></svg></button>
      <button id="miniPin" class="mini-icon-button" type="button" title="置顶窗口" aria-label="置顶窗口" aria-pressed="false"><svg viewBox="0 0 24 24"><path d="M9 3h6l-.6 6 3.6 4v2H6v-2l3.6-4Z"/><path d="M12 15v6"/></svg></button>
      <button id="miniOpenMain" class="mini-icon-button" type="button" title="在主窗口中打开" aria-label="在主窗口中打开"><svg viewBox="0 0 24 24"><path d="M13 4h7v7M20 4l-9 9"/><path d="M10 5H6a2 2 0 0 0-2 2v11a2 2 0 0 0 2 2h11a2 2 0 0 0 2-2v-4"/></svg></button>
      <button id="miniHide" class="mini-icon-button" type="button" title="收起 · Esc" aria-label="收起快捷对话"><svg viewBox="0 0 24 24"><path d="M5 12h14"/></svg></button>
    </header>
    <section id="miniTranscript" class="mini-transcript" aria-label="对话记录" hidden>
      <div id="miniTurns" class="mini-turns"></div>
    </section>
    <div class="mini-decision-area"><div id="interactionSurfaceMount" hidden></div></div>
    <div id="miniError" class="mini-error" role="alert" hidden></div>
    <form id="miniForm" class="mini-composer">
      <textarea id="miniInput" rows="1" placeholder="问点什么…" aria-label="消息" title="Enter 发送 · Shift + Enter 换行" autofocus></textarea>
      <div class="mini-toolbar">
        <button id="miniPermissionMode" class="permission-trigger" type="button" aria-label="对话权限" disabled></button>
        <span class="mini-toolbar-spacer" aria-hidden="true"></span>
        <div class="mini-model">
          <button id="miniModelButton" class="mini-model-button" type="button" aria-haspopup="menu" aria-expanded="false" aria-controls="miniModelMenu"><span id="miniModelLabel">思考</span><svg viewBox="0 0 16 16"><path d="m5 6 3 3 3-3"/></svg></button>
          <div id="miniModelMenu" class="mini-model-menu" role="menu" aria-label="选择模型" hidden>
            <button type="button" role="menuitemradio" data-model="haiku" aria-checked="false" aria-disabled="true" disabled><span>快速</span><small>正在加载模型</small><svg viewBox="0 0 16 16"><path d="m3 8 3 3 7-7"/></svg></button>
            <button type="button" role="menuitemradio" data-model="sonnet" aria-checked="true" aria-disabled="true" disabled><span>思考</span><small>正在加载模型</small><svg viewBox="0 0 16 16"><path d="m3 8 3 3 7-7"/></svg></button>
            <button type="button" role="menuitemradio" data-model="opus" aria-checked="false" aria-disabled="true" disabled><span>专家</span><small>正在加载模型</small><svg viewBox="0 0 16 16"><path d="m3 8 3 3 7-7"/></svg></button>
          </div>
        </div>
        <button id="miniSend" class="mini-send" type="submit" title="发送" aria-label="发送" disabled><svg class="mini-send-arrow" viewBox="0 0 24 24"><path d="M12 19V5m-6 6 6-6 6 6"/></svg><svg class="mini-send-stop" viewBox="0 0 24 24"><rect x="7" y="7" width="10" height="10" rx="2"/></svg></button>
      </div>
    </form>
    <div id="miniLiveStatus" class="sr-only" role="status" aria-live="polite"></div>
  </main>
  <script src="vendor/marked.umd.js"></script>
  <script src="local-file-links.js"></script>
  <script src="local-markdown-images.js"></script>
  <script src="code-blocks.js"></script>
  <script src="read-only-markdown.js"></script>
  <script src="message-time.js"></script>
  <script src="task-continuity.js"></script>
  <script src="assistant-output.js"></script>
  <script src="conversation-errors.js"></script>
  <script src="supplement-timeline.js"></script>
  <script src="model-display.js"></script>
  <script src="permission-controls.js"></script>
  <script src="mini-chat.js"></script>
  <script src="interaction-surface.js"></script>
</body>
</html>
