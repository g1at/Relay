<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <title>Relay</title>
  <link rel="stylesheet" href="fonts/misans.css" />
  <!-- 代码高亮主题(深色,贴合 Mac 代码框);本地打包,离线可用 -->
  <link rel="stylesheet" href="vendor/github-dark.min.css" />
  <link rel="stylesheet" href="styles.css" />
  <!-- markdown 渲染 + 代码高亮:本地打包(内网离线可用,不依赖 CDN) -->
  <script src="vendor/marked.umd.js"></script>
  <script src="vendor/highlight.min.js"></script>
  <script src="vendor/agent-avatar.js"></script>
</head>
<body>
  <div class="app">
    <!-- 侧边栏 -->
    <aside class="sidebar">
      <div class="sidebar-header">
        <div class="logo">
          <img src="logo.png" class="logo-img" id="brandLogo" alt="" />
          <span id="brandName">Relay</span>
        </div>
      </div>

      <!-- 顶部入口列表 -->
      <nav class="nav-list">
        <button class="nav-item" id="btnNewChat" title="直接对话">
          <!-- 新对话:气泡 + 加号(撰写新消息) -->
          <svg class="ni-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <path d="M7.5 18 4 21V6.5A2.5 2.5 0 0 1 6.5 4h11A2.5 2.5 0 0 1 20 6.5v9a2.5 2.5 0 0 1-2.5 2.5z"></path>
            <line x1="12" y1="8.5" x2="12" y2="13.5"></line>
            <line x1="9.5" y1="11" x2="14.5" y2="11"></line>
          </svg>
          <span class="ni-label">新对话</span>
        </button>
        <button class="nav-item" id="btnNewAnalysis" title="选择一个已安装的 Agent 进行对话">
          <!-- Agent:机器人(收窄侧天线,整体 ~16 视觉宽度,与其它图标一致) -->
          <svg class="ni-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <rect x="5" y="8" width="14" height="11" rx="3"></rect>
            <line x1="12" y1="4.5" x2="12" y2="8"></line>
            <circle cx="12" cy="3.5" r="1.2" fill="currentColor" stroke="none"></circle>
            <circle cx="9.5" cy="13" r="1.1" fill="currentColor" stroke="none"></circle>
            <circle cx="14.5" cy="13" r="1.1" fill="currentColor" stroke="none"></circle>
            <line x1="4" y1="12" x2="4" y2="15"></line>
            <line x1="20" y1="12" x2="20" y2="15"></line>
          </svg>
          <span class="ni-label">Agent</span>
        </button>
        <button class="nav-item" id="btnTeam" title="协奏:多 Agent 协同——由 PM 拆解任务、派给多个 Agent 接力完成">
          <!-- 协奏:多人/团队 -->
          <svg class="ni-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="8.5" cy="9" r="2.6"></circle>
            <circle cx="16" cy="8" r="2.2"></circle>
            <path d="M3.5 18c0-2.6 2.2-4.2 5-4.2s5 1.6 5 4.2"></path>
            <path d="M14.5 14c2.4-.2 6 1 6 4"></path>
          </svg>
          <span class="ni-label">协奏</span>
        </button>
        <button class="nav-item" id="btnCreate" title="AI 创作:文字生成图片">
          <!-- AI 创作:图片 + 星点(收窄到与其它图标一致的 ~16 视觉宽度,居中) -->
          <svg class="ni-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <rect x="4" y="5" width="16" height="14" rx="2.5"></rect>
            <circle cx="9" cy="10" r="1.3"></circle>
            <path d="M20 15l-4-4-6 6"></path>
          </svg>
          <span class="ni-label">AI 创作</span>
        </button>
        <button class="nav-item" id="btnSearch" title="搜索历史对话 (Ctrl+K)">
          <!-- 搜索:放大镜 -->
          <svg class="ni-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="11" cy="11" r="7"></circle>
            <line x1="16.5" y1="16.5" x2="21" y2="21"></line>
          </svg>
          <span class="ni-label">搜索</span>
        </button>
      </nav>

      <!-- 历史 -->
      <div class="sidebar-section">
        <div class="section-title">历史对话</div>
        <div class="history-list" id="historyList"></div>
      </div>

    </aside>

    <!-- 主区:聊天 -->
    <main class="chat">
      <div class="chat-header">
        <div class="header-left">
          <button class="btn-icon" id="btnToggleSidebar" title="折叠侧边栏">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
              <rect x="3" y="3" width="18" height="18" rx="2"></rect>
              <line x1="9" y1="3" x2="9" y2="21"></line>
            </svg>
          </button>
          <button class="btn-icon" id="btnHeaderNewChat" title="新对话">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
              <path d="M7.5 18 4 21V6.5A2.5 2.5 0 0 1 6.5 4h11A2.5 2.5 0 0 1 20 6.5v9a2.5 2.5 0 0 1-2.5 2.5z"></path>
              <line x1="12" y1="8.5" x2="12" y2="13.5"></line>
              <line x1="9.5" y1="11" x2="14.5" y2="11"></line>
            </svg>
          </button>
          <button class="btn-icon" id="btnHeaderNewAnalysis" title="Agent">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
              <rect x="4" y="8" width="16" height="11" rx="3"></rect>
              <line x1="12" y1="4" x2="12" y2="8"></line>
              <circle cx="12" cy="3" r="1.2" fill="currentColor" stroke="none"></circle>
              <circle cx="9" cy="13" r="1.1" fill="currentColor" stroke="none"></circle>
              <circle cx="15" cy="13" r="1.1" fill="currentColor" stroke="none"></circle>
              <line x1="2.5" y1="12" x2="2.5" y2="15"></line>
              <line x1="21.5" y1="12" x2="21.5" y2="15"></line>
            </svg>
          </button>
        </div>
        <div class="header-center">
          <div class="chat-title" id="chatTitle">新对话</div>
          <div class="chat-subtitle">内容由 AI 生成，请仔细甄别</div>
        </div>
        <div class="header-actions">
          <button class="btn-icon" id="btnSchedule" title="定时任务:让任务到点自动运行">
            <!-- 定时任务:时钟 -->
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
              <circle cx="12" cy="12" r="9"></circle>
              <path d="M12 7v5l3 2"></path>
            </svg>
          </button>
          <button class="btn-icon" id="btnMyWorkChat" title="库:本地生成的图片与文件">
            <!-- 库(书架,参考 Lucide library) -->
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
              <path d="m16 6 4 14"></path><path d="M12 6v14"></path><path d="M8 8v12"></path><path d="M4 4v16"></path>
            </svg>
          </button>
          <button class="btn-icon" id="btnSettings" title="设置">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
              <circle cx="12" cy="12" r="3"></circle>
              <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path>
            </svg>
          </button>
        </div>
      </div>

      <div class="conversation-stage">
        <nav class="conversation-index hidden" id="conversationIndex" aria-label="对话快捷索引">
          <div class="conversation-index-keys" id="conversationIndexKeys"></div>
        </nav>
        <div class="messages" id="messages">
          <div class="welcome">
            <h2>💬 新对话</h2>
            <p>有什么可以帮你的，直接开始对话吧。<br/>需要调用某个 Agent 时，点左侧「Agent」选择已安装的 Agent。</p>
          </div>
        </div>
      </div>

      <div class="input-area">
        <div class="input-card" id="inputCard">
          <div class="attachments hidden" id="attachments"></div>
          <div class="composer-skill-chip hidden" id="composerSkillChip">
            <svg class="csc-ico" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
              <path d="m12 3 8 4.5-8 4.5-8-4.5z"></path>
              <path d="m4 12 8 4.5 8-4.5"></path>
              <path d="m4 16.5 8 4.5 8-4.5"></path>
            </svg>
            <span class="csc-label" id="composerSkillLabel"></span>
            <button class="csc-clear" id="skillQuickClear" type="button" title="移除技能" aria-label="移除技能">×</button>
          </div>
          <textarea
            id="input"
            placeholder="发消息..."
            rows="1"
          ></textarea>
          <div class="input-bottom">
            <div class="ib-left">
              <button class="btn-attach" id="btnAttach" title="上传文件(也可拖拽)">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                  <line x1="12" y1="5" x2="12" y2="19"/>
                  <line x1="5" y1="12" x2="19" y2="12"/>
                </svg>
              </button>
              <div class="model-switch" id="modelSwitch">
                <button class="ms-trigger" id="btnModelSwitch" type="button" title="切换模型">
                  <span class="ms-ico" id="msIco"></span>
                  <span class="ms-label" id="msLabel">快速</span>
                  <svg class="ms-caret" width="10" height="10" viewBox="0 0 10 10" fill="none">
                    <path d="M2 6l3-3 3 3" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
                  </svg>
                </button>
              </div>
              <!-- 工作目录:设了之后 LLM 的文件读写都在该目录下进行(对话级) -->
              <button class="workdir-btn" id="btnWorkdir" type="button" title="设置工作目录">
                <svg class="wd-ico" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                  <path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path>
                </svg>
                <span class="wd-label" id="wdLabel">工作目录</span>
              </button>
              <button class="skill-quick-btn" id="btnSkillQuick" type="button" title="选择本地技能">
                <svg class="sq-ico" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                  <path d="m12 3 8 4.5-8 4.5-8-4.5z"></path>
                  <path d="m4 12 8 4.5 8-4.5"></path>
                  <path d="m4 16.5 8 4.5 8-4.5"></path>
                </svg>
                <span class="sq-label" id="skillQuickLabel">技能</span>
              </button>
            </div>
            <button id="btnSend" title="发送 (Enter)">
              <!-- 发送箭头(默认) -->
              <svg class="ico-send" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <line x1="12" y1="19" x2="12" y2="5"></line>
                <polyline points="5 12 12 5 19 12"></polyline>
              </svg>
              <!-- 停止方块(运行中) -->
              <svg class="ico-stop" width="14" height="14" viewBox="0 0 14 14">
                <rect x="2" y="2" width="10" height="10" rx="1.5" fill="currentColor"/>
              </svg>
            </button>
          </div>
        </div>
      </div>
    </main>

    <!-- 主区:AI 创作(文生图)。默认隐藏,点侧边栏「AI 创作」切入 -->
    <main class="create-view hidden" id="createView">
      <div class="chat-header">
        <div class="header-left">
          <button class="btn-icon" id="btnToggleSidebar2" title="折叠侧边栏">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
              <rect x="3" y="3" width="18" height="18" rx="2"></rect>
              <line x1="9" y1="3" x2="9" y2="21"></line>
            </svg>
          </button>
          <button class="btn-icon" id="cvHeaderNewChat" title="新对话">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
              <path d="M7.5 18 4 21V6.5A2.5 2.5 0 0 1 6.5 4h11A2.5 2.5 0 0 1 20 6.5v9a2.5 2.5 0 0 1-2.5 2.5z"></path>
              <line x1="12" y1="8.5" x2="12" y2="13.5"></line>
              <line x1="9.5" y1="11" x2="14.5" y2="11"></line>
            </svg>
          </button>
          <button class="btn-icon" id="cvHeaderNewAnalysis" title="Agent">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
              <rect x="4" y="8" width="16" height="11" rx="3"></rect>
              <line x1="12" y1="4" x2="12" y2="8"></line>
              <circle cx="12" cy="3" r="1.2" fill="currentColor" stroke="none"></circle>
              <circle cx="9" cy="13" r="1.1" fill="currentColor" stroke="none"></circle>
              <circle cx="15" cy="13" r="1.1" fill="currentColor" stroke="none"></circle>
              <line x1="2.5" y1="12" x2="2.5" y2="15"></line>
              <line x1="21.5" y1="12" x2="21.5" y2="15"></line>
            </svg>
          </button>
        </div>
        <div class="header-center">
          <div class="chat-title">AI 创作</div>
          <div class="chat-subtitle">内容由 AI 生成，请仔细甄别</div>
        </div>
        <div class="header-actions">
          <button class="btn-icon" id="cvBtnSchedule" title="定时任务:让任务到点自动运行">
            <!-- 定时任务:时钟 -->
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
              <circle cx="12" cy="12" r="9"></circle>
              <path d="M12 7v5l3 2"></path>
            </svg>
          </button>
          <button class="btn-icon" id="btnMyWork" title="库:本地生成的图片与文件">
            <!-- 库(书架,参考 Lucide library) -->
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
              <path d="m16 6 4 14"></path><path d="M12 6v14"></path><path d="M8 8v12"></path><path d="M4 4v16"></path>
            </svg>
          </button>
          <button class="btn-icon" id="cvBtnSettings" title="设置">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
              <circle cx="12" cy="12" r="3"></circle>
              <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path>
            </svg>
          </button>
        </div>
      </div>

      <!-- 结果区(和聊天 messages 同款滚动区):欢迎态 / loading / 图片网格 -->
      <div class="messages" id="cvMessages">
        <div class="welcome">
          <h2>🎨 AI 创作</h2>
          <p>描述你想要的图片，点「生成」即可。<br/>想看本地生成的图片和文件，点右上角「库」。</p>
        </div>
      </div>

      <!-- 底部输入区(复用聊天输入卡风格) -->
      <div class="input-area">
        <div class="input-card" id="cvInputCard">
          <div class="attachments hidden" id="cvAttachments"></div>
          <textarea id="cvPrompt" placeholder="描述你想要的图片…（英文描述效果通常更佳）" rows="1"></textarea>
          <div class="input-bottom">
            <div class="ib-left">
              <!-- 上传参考图(图生图):与新对话的 + 同款。仅豆包支持,带图后 GPT 自动置灰 -->
              <button class="btn-attach" id="cvBtnAttach" title="上传参考图(豆包支持图生图)">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                  <line x1="12" y1="5" x2="12" y2="19"/>
                  <line x1="5" y1="12" x2="19" y2="12"/>
                </svg>
              </button>
              <!-- 模型 / 画质 / 比例:与新对话模型切换器同款的自定义弹出下拉(按钮固定显示「模型」「画质」「比例」) -->
              <div class="model-switch" id="cvModelSwitch">
                <button class="ms-trigger" id="cvModelTrigger" type="button" title="选择模型">
                  <span class="ms-ico" id="cvModelIco"></span>
                  <span class="ms-label" id="cvModelLabel">模型</span>
                  <svg class="ms-caret" width="10" height="10" viewBox="0 0 10 10" fill="none"><path d="M2 6l3-3 3 3" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
                </button>
              </div>
              <!-- 画质:豆包切分辨率档(2K/3K/4K),GPT 切清晰度(标准/高清) -->
              <div class="model-switch" id="cvQualitySwitch">
                <button class="ms-trigger" id="cvQualityTrigger" type="button" title="选择画质">
                  <span class="ms-ico" id="cvQualityIco"></span>
                  <span class="ms-label" id="cvQualityLabel">画质</span>
                  <svg class="ms-caret" width="10" height="10" viewBox="0 0 10 10" fill="none"><path d="M2 6l3-3 3 3" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
                </button>
              </div>
              <div class="model-switch" id="cvSizeSwitch">
                <button class="ms-trigger" id="cvSizeTrigger" type="button" title="选择比例">
                  <span class="ms-ico" id="cvSizeIco"></span>
                  <span class="ms-label" id="cvSizeLabel">比例</span>
                  <svg class="ms-caret" width="10" height="10" viewBox="0 0 10 10" fill="none"><path d="M2 6l3-3 3 3" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
                </button>
              </div>
              <!-- 组图不再用手动按钮:由提示词自动判断(命中"组图/分N步/N张/系列"等词即开,仅豆包) -->
            </div>
            <button id="btnGenerate" title="生成 (Enter)">
              <svg class="ico-send" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <line x1="12" y1="19" x2="12" y2="5"></line>
                <polyline points="5 12 12 5 19 12"></polyline>
              </svg>
            </button>
          </div>
        </div>
      </div>
    </main>

    <!-- 定时任务:弹出式管理框（沿用「设置」模态外壳，默认隐藏，点头部时钟图标打开） -->
    <div class="modal-backdrop hidden" id="scheduleModal">
      <div class="modal">
        <div class="modal-header">
          <button class="btn-icon sv-modal-add" id="svModalAdd" title="新建定时任务" aria-label="新建定时任务">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor"
              stroke-width="2" stroke-linecap="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
          </button>
          <div class="modal-title" id="svModalTitle">定时任务</div>
          <button class="btn-icon" id="svModalClose" title="关闭">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
          </button>
        </div>

      <!-- 列表面板（默认显示） -->
      <div class="modal-body sv-listbody" id="svListPane">
        <label class="sv-search" for="svSearchInput">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor"
            stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="11" cy="11" r="7"/><line x1="20" y1="20" x2="16.65" y2="16.65"/>
          </svg>
          <input id="svSearchInput" type="search" autocomplete="off" placeholder="搜索定时任务">
        </label>
        <!-- 任务列表 -->
        <div class="sv-list" id="svList">
          <div class="sv-empty" id="svEmpty">
            <h2>⏰ 还没有定时任务</h2>
            <p>让任务到点自动运行：每日摘要、定时提醒、周期检查……<br/>在对话框里说一句就能创建。</p>
            <p class="sv-note">注：定时任务只在 Relay 运行时触发。应用没开着时到点的任务，会在下次启动时补跑一次。</p>
          </div>
        </div>

      </div>
      <!-- 编辑面板：与任务列表在同一窗口内切换，避免再叠一层弹窗。 -->
      <div class="modal-body sv-editorbody hidden" id="svEditorPane"></div>
      <div class="modal-footer sv-editor-footer hidden" id="svEditorFooter">
        <button class="btn-ghost" id="svEditorBack">返回</button>
        <div class="footer-hint" id="svEditorHint"></div>
        <div class="footer-actions">
          <button class="btn-primary" id="svEditorSave">保存</button>
        </div>
      </div>
      </div><!-- /.modal -->
    </div><!-- /.modal-backdrop#scheduleModal -->

    <!-- 设置模态窗(放在 .app 下、两个 main 之外,这样切到任意视图都能弹出,不被 hidden 的 main 连带隐藏) -->
    <div class="modal-backdrop hidden" id="settingsModal">
      <div class="modal">
        <div class="modal-header">
          <div class="modal-title">设置</div>
          <button class="btn-icon" id="btnCloseSettings" title="关闭">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <line x1="18" y1="6" x2="6" y2="18"></line>
              <line x1="6" y1="6" x2="18" y2="18"></line>
            </svg>
          </button>
        </div>
        <div class="modal-body" id="settingsBody">
          <!-- 渲染端动态填充 -->
        </div>
        <div class="modal-footer">
          <button class="btn-ghost" id="btnSettingsBack" style="display:none">返回</button>
          <div class="footer-hint" id="settingsHint"></div>
          <div class="footer-actions">
            <button class="btn-ghost" id="btnSettingsCancel">取消</button>
            <button class="btn-primary" id="btnSettingsSave">保存</button>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script src="activity-stream.js"></script>
  <script src="app.js"></script>
</body>
</html>
