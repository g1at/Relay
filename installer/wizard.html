<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self'; font-src 'self'; object-src 'none'; base-uri 'none'" />
  <title>欢迎使用 Relay</title>
  <link rel="stylesheet" href="../renderer/fonts/misans.css" />
  <link rel="stylesheet" href="wizard.css" />
  <link rel="stylesheet" href="../renderer/brand.css" />
</head>
<body>
  <main class="welcome-shell" aria-labelledby="welcomeTitle">
    <header class="welcome-header">
      <img src="../renderer/logo.svg" class="brand-logo relay-default-logo" alt="Relay" draggable="false" />
      <span class="welcome-eyebrow">首次使用</span>
    </header>

    <section class="welcome-content" tabindex="0" aria-label="开始使用说明">
      <div class="welcome-intro">
        <h1 id="welcomeTitle">欢迎使用 Relay</h1>
        <p class="lead">连接你常用的模型，开始对话、创作和处理项目。</p>
      </div>

      <ol class="welcome-steps" aria-label="接下来">
        <li class="welcome-step">
          <span class="step-icon" aria-hidden="true">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.65" stroke-linecap="round" stroke-linejoin="round"><path d="M8 3v5m8-5v5M6 8h12v3a6 6 0 0 1-12 0V8Zm6 9v4" /></svg>
          </span>
          <div><h2>连接模型</h2><p>进入后，在“设置 → 服务商”中添加你的模型服务。</p></div>
        </li>
        <li class="welcome-step">
          <span class="step-icon" aria-hidden="true">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.65" stroke-linecap="round" stroke-linejoin="round"><path d="M9 3H5a2 2 0 0 0-2 2v4h3a3 3 0 0 1 0 6H3v4a2 2 0 0 0 2 2h4v-3a3 3 0 0 1 6 0v3h4a2 2 0 0 0 2-2v-4h-3a3 3 0 0 1 0-6h3V5a2 2 0 0 0-2-2h-4v3a3 3 0 0 1-6 0V3Z" /></svg>
          </span>
          <div><h2>按需拓展</h2><p>在插件中添加技能和工具，让 Relay 适应你的工作。</p></div>
        </li>
      </ol>
    </section>

    <footer class="welcome-footer">
      <div class="welcome-status">
        <p id="statusText" role="status" aria-live="polite" aria-atomic="true">无需登录 Relay 账号</p>
        <p id="errorText" class="error-message" role="alert" aria-atomic="true" hidden></p>
      </div>
      <button class="btn-primary" id="btnEnter" type="button">
        <span id="enterLabel">进入 Relay</span>
        <svg class="enter-arrow" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14m-5-5 5 5-5 5" /></svg>
        <span class="enter-spinner" aria-hidden="true"></span>
      </button>
    </footer>
  </main>
  <script src="wizard.js"></script>
</body>
</html>
