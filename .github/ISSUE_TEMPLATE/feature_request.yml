name: 功能建议
description: 描述使用场景和希望改善的体验
title: "[建议] "
body:
  - type: textarea
    id: problem
    attributes:
      label: 当前遇到的问题
      description: 说明你在完成什么任务，以及目前哪里不方便。示例请使用合成数据。
    validations:
      required: true
  - type: textarea
    id: desired
    attributes:
      label: 期望的行为
      description: 用一个具体例子描述完成后的效果。
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 现有替代方法与取舍
      description: 可选；说明已经尝试的方法及不能满足需求的原因。
