name: Windows CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Node 24 / Windows x64
    # The locked node-gyp 9 recognizes VS 2022, but not the VS 2026 image now used by latest.
    runs-on: windows-2022
    timeout-minutes: 45
    defaults:
      run:
        shell: pwsh
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          architecture: x64
          package-manager-cache: false

      - name: Set up Python for native dependencies
        id: python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11'
          architecture: x64

      - name: Install locked dependencies
        env:
          PYTHON: ${{ steps.python.outputs.python-path }}
        run: npm ci

      - name: Check public documentation and assets
        run: node build/check-public-docs.cjs

      - name: Unit and regression tests
        run: node --test --test-timeout=60000 --test-concurrency=2 test/*.test.js

      - name: Renderer smoke test with isolated fixtures
        run: npm run test:ui

      - name: Verify native installer skin
        run: npm run verify:installer-skin

      - name: Build Windows directory without publishing
        env:
          PYTHON: ${{ steps.python.outputs.python-path }}
        run: npm run build:dir -- --x64 --publish never
